name: 部署到 GitHub Pages

# 只在 pages 分支上触发：main 分支保持「服务端版」，两条线互不干扰。
on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 把服务端的量化内核搬进 web/js/core/（部署产物里才有）
      - name: 同步浏览器端核心模块
        run: node scripts/sync-core.mjs

      # 国内网络访问 api.frankfurter.app（Cloudflare）经常被拦，浏览器端会 CORS 失败。
      # 所以在构建时把 ECB 日线抓成同源快照，随站点一起发布。
      - name: 抓取 ECB 日线快照
        run: node scripts/fetch-ecb.mjs
        continue-on-error: true

      # 注入静态标记，省掉前端一次必然 404 的后端探测
      - name: 标记静态构建
        run: |
          sed -i 's|<script type="module" src="./js/app.js"></script>|<script>window.__FXLAB_STATIC__=true</script>\n  <script type="module" src="./js/app.js"></script>|' web/index.html
          grep -q "__FXLAB_STATIC__" web/index.html && echo "✔ 已注入静态标记"

      # 只跑不依赖外网的测试：GitHub 的机器访问新浪/东财不稳定，别让网络抖动挡住部署
      - name: 单元测试（不依赖外网）
        run: |
          node tests/quant.test.mjs
          node tests/chart.test.mjs

      - uses: actions/configure-pages@v5
        with:
          # 首次部署时仓库里还没有 Pages 站点记录，GET /pages 会 404；
          # enablement: true 允许这个 Action 直接把站点建出来（需要 pages: write）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
